name: Sync upstream main

on:
  schedule:
    # Every 6 hours (UTC). Keeps official-main mirrored to upstream.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/openai/codex-security.git
          git fetch upstream main --prune

      - name: Mirror official-main to upstream/main
        run: |
          git branch -f official-main upstream/main
          git push origin official-main:official-main

      - name: Merge upstream into main
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git checkout main
          git merge --ff-only upstream/main \
            || git merge upstream/main -m "chore: merge upstream main"
          git push origin main

      - name: Report synced revisions
        run: |
          git fetch origin
          echo "upstream/main      = $(git rev-parse --short upstream/main)"
          echo "origin/official-main = $(git rev-parse --short origin/official-main)"
          echo "origin/main          = $(git rev-parse --short origin/main)"
